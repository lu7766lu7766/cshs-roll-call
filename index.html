<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>清水高中 選修課程點名系統</title>

  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="清水點名">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="assets/favicon.png">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css?v=12">
</head>
<body>
  <div id="app">
    <!-- Top Header Navigation -->
    <header class="app-header">
      <div class="brand">
        <img src="assets/favicon.png" alt="" class="brand-icon">
        <div class="brand-text">
          <div class="brand-title">清水點名</div>
          <div class="brand-subtitle" id="currentAccountBadge">cshs643</div>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" class="icon-btn" id="historyBtn" title="歷史點名紀錄" aria-label="歷史點名紀錄">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 8v4l3 3"></path>
            <path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5"></path>
          </svg>
        </button>
        <button type="button" class="icon-btn" id="settingsBtn" title="系統與帳號設定" aria-label="系統與帳號設定">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Notification / Status Banner -->
    <div id="statusBanner" class="status-banner is-syncing">
      <div class="status-banner-main">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="bannerText">正在連線後台同步課程與名冊…</span>
      </div>
      <span id="bannerTime" class="status-time">同步中</span>
    </div>

    <!-- Resident Frontend Error Panel -->
    <div id="errorPanel" class="error-panel hidden" role="alert" aria-live="assertive"></div>

    <!-- ==========================================
         VIEW 1: COURSE SELECTION (選擇課程頁面)
         ========================================== -->
    <main id="courseView" class="view-section">
      <!-- 今日概況 -->
      <section class="today-panel" aria-label="今日概況">
        <div class="today-date">
          <span class="today-day-num" id="todayDayNum">--</span>
          <span class="today-day-meta" id="currentDateDisplay">載入日期中…</span>
        </div>
        <div class="today-summary">
          <div class="today-headline" id="todayHeadline">正在整理今日課程…</div>
          <div class="today-sub" id="todaySub">&nbsp;</div>
        </div>
      </section>

      <!-- Weekday Filter Tabs (Segmented Control) -->
      <nav class="grade-tabs" aria-label="課程星期篩選">
        <button type="button" class="tab-btn active" data-grade="all" data-weekday="all">
          <span>全部</span>
          <span class="tab-badge" id="badgeAll">0</span>
        </button>
        <button type="button" class="tab-btn" data-grade="1" data-weekday="1">
          <span>週一</span>
          <span class="tab-badge" id="badgeGrade1">0</span>
        </button>
        <button type="button" class="tab-btn" data-grade="2" data-weekday="2">
          <span>週二</span>
          <span class="tab-badge" id="badgeGrade2">0</span>
        </button>
        <button type="button" class="tab-btn" data-grade="3" data-weekday="3">
          <span>週三</span>
          <span class="tab-badge" id="badgeGrade3">0</span>
        </button>
      </nav>

      <!-- Course Cards Container -->
      <div id="courseContainer" class="course-grid">
        <div id="courseLoadingIndicator" class="empty-state">
          <div class="spinner" aria-hidden="true"></div>
          <p class="empty-state-title">正在連線清水高中後台同步課程與名冊…</p>
          <span class="empty-state-sub">初次連線約需 3–5 秒，完成後將自動快取於本機</span>
        </div>
      </div>
    </main>

    <!-- ==========================================
         VIEW 2: ROLL CALL SCREEN (點名頁面)
         ========================================== -->
    <main id="rollCallView" class="view-section hidden">
      <div class="rollcall-hero">
        <div class="course-back-bar">
          <button type="button" class="back-btn" id="backToCoursesBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m15 18-6-6 6-6"></path>
            </svg>
            <span>課程</span>
          </button>
          <span class="grade-tag" id="currentCourseGradeTag">週二選修</span>
        </div>
        <h2 class="rollcall-title" id="currentCourseTitle">載入中...</h2>
        <div class="rollcall-subtitle">
          <span id="currentRollCallDate">2026/10/13</span>
          <span id="currentCourseCode">代碼 643</span>
          <span id="currentCourseClassroom">清水高中選修班</span>
        </div>

        <!-- 節次多選器 (Multi-Select Periods) -->
        <div class="period-selection-section">
          <div class="period-selection-header">
            <span class="period-selection-label">點名節次</span>
            <span class="period-count-hint" id="periodCountHint">已選擇 2 節</span>
          </div>
          <div class="period-chip-group" id="periodChipGroup">
            <!-- 由 app.js 根據目前課程真實節次動態產生 -->
          </div>
        </div>
      </div>

      <!-- Attendance Realtime Meter -->
      <div class="attendance-meter">
        <div class="meter-head">
          <div class="meter-figure">
            <span class="meter-present val-present" id="statPresent">0</span>
            <span class="meter-total">/ <span id="statTotal">0</span> 出席</span>
          </div>
          <div class="meter-legend">
            <span class="legend-item legend-late">遲到 <b class="val-leave" id="statLeave">0</b></span>
            <span class="legend-item legend-absent">缺席 <b class="val-absent" id="statAbsent">0</b></span>
          </div>
        </div>
        <div class="meter-bar" aria-hidden="true">
          <span class="meter-seg seg-present" id="meterPresent"></span>
          <span class="meter-seg seg-late" id="meterLate"></span>
          <span class="meter-seg seg-absent" id="meterAbsent"></span>
        </div>
      </div>

      <!-- Roster Toolbar (Search + Quick Actions) -->
      <div class="roster-toolbar">
        <div class="search-box">
          <span class="search-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.3-4.3"></path>
            </svg>
          </span>
          <input type="search" id="studentSearchInput" class="search-input" placeholder="搜尋學生" enterkeyhint="search">
        </div>
        <button type="button" class="quick-btn" id="sortSeatBtn" aria-label="切換座號排序">
          <span>座號 ↑</span>
        </button>
        <button type="button" class="quick-btn all-present-btn" id="allPresentBtn">
          <span>全到</span>
        </button>
      </div>

      <!-- Student Roster List -->
      <div id="studentListContainer" class="student-list">
        <!-- Rendered by app.js -->
      </div>
    </main>

    <!-- ==========================================
         VIEW 3: HISTORY LOGS (歷史點名紀錄)
         ========================================== -->
    <main id="historyView" class="view-section hidden">
      <div class="section-header history-section-header">
        <div class="history-header-left">
          <button type="button" class="back-btn" id="backFromHistoryBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 12H5"></path>
              <path d="m12 19-7-7 7-7"></path>
            </svg>
            <span>返回</span>
          </button>
          <h2 class="section-title">歷史點名紀錄</h2>
        </div>
        <button type="button" class="btn-ghost-danger" id="clearHistoryBtn" title="清空紀錄" aria-label="清空紀錄">清空紀錄</button>
      </div>
      <div id="historyListContainer" class="history-list">
        <!-- Rendered by app.js -->
      </div>
    </main>

    <!-- ==========================================
         Sticky Bottom Action Bar (送出面板)
         ========================================== -->
    <div id="bottomActionBar" class="bottom-action-bar hidden">
      <div class="bottom-summary">
        <div class="bottom-summary-text is-all-present" id="bottomSummaryText">全到出席 (0/0)</div>
        <div class="bottom-summary-sub" id="bottomPeriodSummary">預計送出：第 3、4 節</div>
      </div>
      <button type="button" id="submitRollCallBtn" class="submit-btn">
        <span>送出點名</span>
      </button>
    </div>

    <!-- ==========================================
         Settings Modal (設定抽屜)
         ========================================== -->
    <div id="settingsModal" class="modal-backdrop">
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="settingsModalTitle">
        <div class="modal-header">
          <h3 class="modal-title" id="settingsModalTitle">系統與帳號設定</h3>
          <button type="button" class="icon-btn" id="closeSettingsBtn" title="關閉設定" aria-label="關閉設定">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 6 6 18"></path>
              <path d="m6 6 12 12"></path>
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="settingAcc">預設帳號（已寫死免輸入）</label>
            <input type="text" id="settingAcc" class="form-input" value="cshs643">
          </div>
          <div class="form-group">
            <label class="form-label" for="settingPwd">預設密碼（可隨管理員重設更新）</label>
            <input type="text" id="settingPwd" class="form-input" value="cshs643">
          </div>
          <div class="form-group">
            <label class="form-label" for="settingApiUrl">GAS 後端 Web App URL</label>
            <input type="text" id="settingApiUrl" class="form-input" value="https://script.google.com/macros/s/AKfycbyYvKw5AoGJv-7P7ofv0YO_h627vOOm-NtYjhb47lo4AdAcfO2md0G2FYXp6Gg0U33I/exec">
          </div>
          <div class="form-group">
            <label class="form-label" for="settingSubmitMode">送出傳輸模式</label>
            <select id="settingSubmitMode" class="form-input">
              <option value="iframe">背景隱形表單（免 CORS 限制，直連 GAS 後端）</option>
              <option value="fetch">Fetch 非同步直接請求</option>
              <option value="local_test">本機模擬送出測試（供帳號未解鎖時演示）</option>
            </select>
          </div>
          <div class="form-group form-group-maintenance">
            <label class="form-label">快取與資料維護</label>
            <div class="maintenance-actions">
              <button type="button" class="btn-secondary btn-block" id="modalResyncBtn">
                <span>立即重新同步名冊</span>
              </button>
              <button type="button" class="btn-danger-outline btn-block" id="modalClearCacheBtn">
                <span>清除快取與離線 Service Worker</span>
              </button>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" id="resetDefaultBtn">回復預設</button>
          <button type="button" class="btn-primary" id="saveSettingsBtn">儲存設定</button>
        </div>
      </div>
    </div>

    <!-- Hidden sink iframe for background zero-CORS submission to Google Apps Script -->
    <iframe name="gas_submission_sink" id="gasSubmissionSink" class="hidden" title="GAS Submission Sink"></iframe>
    <form id="gasHiddenForm" class="hidden" target="gas_submission_sink" method="post" action="https://script.google.com/macros/s/AKfycbyYvKw5AoGJv-7P7ofv0YO_h627vOOm-NtYjhb47lo4AdAcfO2md0G2FYXp6Gg0U33I/exec">
      <input type="hidden" name="method" id="gasFormMethod" value="write">
      <input type="hidden" name="acc" id="gasFormAcc" value="cshs643">
      <input type="hidden" name="pwd" id="gasFormPwd" value="cshs643">
      <input type="hidden" name="courseId" id="gasFormCourseId" value="">
      <input type="hidden" name="period" id="gasFormPeriod" value="">
      <input type="hidden" name="date" id="gasFormDate" value="">
      <input type="hidden" name="data" id="gasFormData" value="">
    </form>

    <!-- Toast Notification -->
    <div id="toastNotification" class="toast" role="status" aria-live="polite">
      <span id="toastIcon" class="toast-icon"></span>
      <span id="toastMsg">點名紀錄已成功送出</span>
    </div>
  </div>

  <!-- Application Scripts -->
  <script src="app.js?v=12"></script>
</body>
</html>
